# .github/workflows/template.yml — TEMPLATE ONLY (hk:init deletes it). Proves that every module combination still initialises and
# passes the whole gate ladder, so a change that breaks one combination fails here, not in somebody's new app.
name: template
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: template-${{ github.ref }}
  cancel-in-progress: true

jobs:
  init:
    name: hk:init --modules ${{ matrix.modules }} → npm run check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        modules: [none, auth, offline, 'auth,offline']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npx --yes npm@10.9.2 clean-install --progress=false --no-audit --no-fund
      - name: Template is valid (markers, manifest, variants)
        run: node .hk-template/hk-init.mjs --check
      - name: Initialise as a new app
        run: node .hk-template/hk-init.mjs --yes --name "Demo App" --slug demo-app --domain demo.example.com --modules "${{ matrix.modules }}"
      - name: Browser for the end-to-end tests
        run: npx playwright install --with-deps --no-shell chromium
      - run: npm run check
