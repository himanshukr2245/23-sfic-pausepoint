# .github/workflows/keep-awake.yml — a free Supabase project pauses after about a week without activity, and a paused project means
# nobody can sign in. Once a day this asks the live site for its deep health check, which touches Supabase Auth and the database.
# Set the repository variable SITE_URL (Settings → Secrets and variables → Actions → Variables) when the app has its own domain.
# GitHub turns off scheduled workflows in a repository with no commits for 60 days — re-enable it under Actions if that happens.
name: keep-awake
on:
  schedule:
    - cron: '17 3 * * *'                                           # daily, 03:17 UTC (08:47 IST)
  workflow_dispatch:
permissions: {}                                                    # needs no access to the repository at all

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deep health check (Supabase Auth + database)
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://starter.hkr.dpdns.org' }}
        run: curl --fail --silent --show-error --max-time 30 --retry 3 --retry-delay 10 "$SITE_URL/api/health?deep=1"
