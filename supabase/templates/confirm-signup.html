<!-- Supabase → Authentication → Emails → "Confirm signup". Subject: Confirm your HK Starter account
     The link lands on /auth/confirm, which shows a button: the one-time link is used only when the person taps it (mail scanners
     open links ahead of people). Plain inline styles only — email apps ignore stylesheets; no images, no tracking. -->
<div style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #1f2430;">
  <h1 style="font-size: 22px; line-height: 1.3; margin: 0 0 12px;">Confirm your email</h1>
  <p style="font-size: 16px; line-height: 1.5; margin: 0 0 20px;">Tap the button to confirm <strong>{{ .Email }}</strong> and finish creating your HK Starter account.</p>
  <p style="margin: 0 0 24px;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/notes"
       style="display: inline-block; background: #4f46e5; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 16px; padding: 14px 22px; border-radius: 12px;">Confirm my email</a>
  </p>
  <p style="font-size: 14px; line-height: 1.5; color: #5b6170; margin: 0;">Did not ask for this? Ignore this email — nothing happens without the tap.</p>
</div>
