<!-- Supabase → Authentication → Emails → "Change email address". Subject: Confirm your new HK Starter email -->
<div style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #1f2430;">
  <h1 style="font-size: 22px; line-height: 1.3; margin: 0 0 12px;">Confirm your new email</h1>
  <p style="font-size: 16px; line-height: 1.5; margin: 0 0 20px;">Tap the button to sign in to HK Starter with <strong>{{ .NewEmail }}</strong> from now on (instead of {{ .Email }}).</p>
  <p style="margin: 0 0 24px;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change&next=/account"
       style="display: inline-block; background: #4f46e5; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 16px; padding: 14px 22px; border-radius: 12px;">Confirm my new email</a>
  </p>
  <p style="font-size: 14px; line-height: 1.5; color: #5b6170; margin: 0;">Did not ask for this? Ignore this email and your sign-in email stays the same.</p>
</div>
