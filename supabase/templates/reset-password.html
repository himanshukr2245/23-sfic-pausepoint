<!-- Supabase → Authentication → Emails → "Reset password". Subject: Choose a new HK Starter password
     /auth/confirm (type=recovery) signs the person in after their tap, then sends them to /auth/reset to choose the new password. -->
<div style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #1f2430;">
  <h1 style="font-size: 22px; line-height: 1.3; margin: 0 0 12px;">Choose a new password</h1>
  <p style="font-size: 16px; line-height: 1.5; margin: 0 0 20px;">Someone asked to reset the password for <strong>{{ .Email }}</strong> on HK Starter. Tap the button to choose a new one.</p>
  <p style="margin: 0 0 24px;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
       style="display: inline-block; background: #4f46e5; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 16px; padding: 14px 22px; border-radius: 12px;">Choose a new password</a>
  </p>
  <p style="font-size: 14px; line-height: 1.5; color: #5b6170; margin: 0;">Did not ask for this? Ignore this email — your password stays the same.</p>
</div>
